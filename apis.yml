aid: skytap
name: Skytap
description: >-
  Skytap (now delivered as Kyndryl Cloud Uplift) is a cloud service for running
  IBM Power (AIX, IBM i) and x86 workloads natively in Microsoft Azure, enabling
  enterprises to lift-and-shift traditional data-center applications into
  self-service, on-demand virtual environments without re-architecting them. The
  Skytap Cloud REST API (v1 and v2, hosted at cloud.skytap.com, HTTP Basic auth
  with an API token) programmatically manages environments (configurations),
  virtual machines, networks, templates, users, projects, assets, public IPs,
  schedules, usage reports and webhooks. It is the engine behind Skytap's
  official Terraform provider, Go SDK, PowerShell module, and Ansible and Vagrant
  integrations. Skytap is a portfolio company of Insight Partners.
